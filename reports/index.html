<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibility Report — Evidenta11y</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0a0f2e;
    --teal: #00d4a0;
    --text: #1a1a1a;
    --muted: #555555;
    --rule: #cccccc;
    --soft-rule: #eaeaea;
    --card-bg: #fafafa;
    --tag-bg: #f5f5f5;
    --good: #1a7a5e;
    --warn: #8a5a00;
    --bad: #c0392b;
    --info-blue: #1a5276;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: #ffffff; color: var(--text); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* Top brand bar */
  .page-header {
    background: var(--navy); color: #ffffff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; gap: 1rem; flex-wrap: wrap;
  }
  .page-header .logo {
    font-family: var(--serif); font-size: 1.4rem; color: var(--teal);
    text-decoration: none; letter-spacing: -0.02em;
  }
  .page-header .home-link { color: rgba(255,255,255,0.78); font-size: 0.85rem; text-decoration: none; }
  .page-header .home-link:hover { color: #ffffff; }
  .pdf-btn {
    background: var(--teal); color: var(--navy);
    font-family: var(--sans); font-weight: 600; font-size: 0.85rem;
    padding: 0.55rem 1.2rem; border: none; border-radius: 6px; cursor: pointer;
  }
  .pdf-btn:hover { filter: brightness(0.95); }

  main {
    max-width: 880px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem;
  }

  /* States */
  .state {
    margin: 4rem auto; max-width: 480px; text-align: center;
    padding: 2rem; border: 1px solid var(--soft-rule); border-radius: 12px; background: var(--card-bg);
  }
  .state h2 { font-family: var(--serif); font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--text); }
  .state p { color: var(--muted); font-size: 0.95rem; }

  /* Report header */
  .report-header { margin-bottom: 1.75rem; }
  .report-header .label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
  h1 { font-family: var(--serif); font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: 1.15; color: var(--text); margin-bottom: 0.75rem; }
  .report-header .meta { color: var(--muted); font-size: 0.9rem; }
  .report-header .meta strong { color: var(--text); font-weight: 500; }
  .report-header .url { word-break: break-all; }

  /* Sections */
  section { margin-bottom: 2rem; }
  h2 { font-family: var(--serif); font-size: 1.3rem; color: var(--text); margin-bottom: 0.75rem; }
  h3 { font-family: var(--sans); font-weight: 600; font-size: 1rem; color: var(--text); margin-bottom: 0.5rem; }
  p { color: var(--text); font-size: 0.95rem; line-height: 1.6; }
  p.muted { color: var(--muted); }

  /* Avg-score block */
  .avg-score {
    text-align: center; padding: 1.25rem 1.5rem; border: 1px solid var(--soft-rule);
    border-radius: 12px; background: var(--card-bg); margin-bottom: 1rem;
    display: inline-block;
  }
  .avg-score .label { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 0.3rem; }
  .avg-score .value { font-family: var(--serif); font-size: 3rem; line-height: 1; font-weight: 700; }

  /* Stat tiles row */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
  .stat-tile { padding: 0.9rem 1rem; border: 1px solid var(--soft-rule); border-radius: 10px; background: var(--card-bg); text-align: center; }
  .stat-tile .v { font-family: var(--serif); font-size: 1.6rem; line-height: 1; font-weight: 700; color: var(--text); }
  .stat-tile .l { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }

  /* Disclaimer / callouts */
  .callout { padding: 1rem 1.15rem; border-radius: 10px; border: 1px solid var(--soft-rule); background: var(--card-bg); margin-bottom: 1rem; }
  .callout p { font-size: 0.875rem; line-height: 1.55; }
  .callout strong { color: var(--text); }
  .critical-callout { border: 1px solid var(--bad); background: #fde8e8; }
  .critical-callout .heading { color: var(--bad); font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; }
  .critical-callout ul { list-style: none; margin: 0; padding: 0; }
  .critical-callout li { color: var(--text); font-size: 0.9rem; padding: 0.25rem 0; }
  .critical-callout li strong { font-weight: 700; }
  .critical-callout li .meta { color: var(--muted); }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 0.5rem; }
  caption { text-align: left; font-weight: 600; padding: 0.5rem 0; color: var(--text); }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--soft-rule); vertical-align: top; word-break: break-word; }
  th { background: var(--tag-bg); font-weight: 600; color: var(--text); border-bottom: 1px solid var(--rule); }
  th.num, td.num { text-align: right; white-space: nowrap; width: 8rem; }

  /* Bar chart for "most common" */
  .bar-track { height: 8px; background: #e5e5e5; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--good); }

  /* Top priority list */
  ol.priority { margin: 0; padding-left: 0; list-style: none; }
  ol.priority li { padding: 0.4rem 0; color: var(--text); font-size: 0.95rem; line-height: 1.55; border-bottom: 1px dashed var(--soft-rule); }
  ol.priority li:last-child { border-bottom: none; }
  ol.priority li strong { font-weight: 700; }
  ol.priority li .meta { color: var(--muted); }

  /* Estimate card */
  .estimate { padding: 1rem 1.15rem; background: var(--card-bg); border: 1px solid var(--soft-rule); border-radius: 10px; }
  .estimate .h { font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 0.3rem; }
  .estimate .b { font-size: 0.88rem; color: var(--muted); line-height: 1.55; }

  /* Per-page sections */
  .page-section { padding-top: 1.25rem; border-top: 1px solid var(--soft-rule); margin-top: 1.25rem; }
  .page-section .head { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .page-section .head .url { font-weight: 500; color: var(--text); word-break: break-all; flex: 1; min-width: 220px; }
  .page-section .head .score { color: var(--muted); font-size: 0.88rem; }
  .page-section .head .score strong { font-weight: 600; }
  .no-violations { color: var(--muted); font-style: italic; font-size: 0.9rem; padding: 0.5rem 0; }

  /* Severity badge */
  .badge {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px;
    border-radius: 3px; vertical-align: middle; white-space: nowrap;
  }
  .badge-critical { background: #fde8e8; color: var(--bad); border: 1px solid var(--bad); }
  .badge-serious  { background: #fef3e2; color: var(--warn); border: 1px solid var(--warn); }
  .badge-moderate { background: #e8f4fd; color: var(--info-blue); border: 1px solid var(--info-blue); }
  .badge-minor    { background: #f0f0f0; color: var(--muted); border: 1px solid #aaaaaa; }

  /* Failing-element snippet */
  .snippet {
    display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem; color: var(--text); background: var(--tag-bg);
    padding: 0.4rem 0.55rem; border-radius: 4px; word-break: break-all;
    white-space: pre-wrap; max-height: 6rem; overflow: hidden;
  }
  .target { color: var(--good); font-size: 0.78rem; margin-top: 0.25rem; word-break: break-all; }

  /* Calendly CTA */
  .calendly-cta { margin-top: 2.5rem; padding: 1.5rem 1.75rem; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--soft-rule); text-align: center; }
  .calendly-cta h2 { margin-bottom: 0.4rem; font-size: 1.2rem; }
  .calendly-cta p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
  .calendly-cta a {
    display: inline-block; background: var(--navy); color: #ffffff; font-weight: 600; font-size: 0.95rem;
    padding: 0.7rem 1.4rem; border-radius: 8px; text-decoration: none;
  }
  .calendly-cta a:hover { filter: brightness(1.15); }

  /* Page footer */
  .page-footer { max-width: 880px; margin: 0 auto; padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--soft-rule); }
  .page-footer a { color: var(--muted); text-decoration: none; }
  .page-footer a:hover { color: var(--text); }

  @media (max-width: 600px) {
    .page-header .home-link { display: none; }
    h1 { font-size: 1.45rem; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- Signup modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,15,46,0.55);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    position: relative;
    width: min(460px, 100%); max-height: 92vh; overflow: auto;
    background: #ffffff; color: var(--text);
    border-radius: 14px; padding: 1.75rem 1.75rem 1.5rem;
    box-shadow: 0 24px 60px rgba(0,0,0,0.28);
  }
  .modal-close {
    position: absolute; top: 0.5rem; right: 0.7rem;
    background: transparent; border: 0; padding: 0.3rem 0.55rem;
    font-size: 1.5rem; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 4px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-close:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
  .modal-title { font-family: var(--serif); font-size: 1.3rem; line-height: 1.25; color: var(--text); margin: 0 0 0.4rem; }
  .modal-sub { color: var(--muted); font-size: 0.88rem; line-height: 1.55; margin: 0 0 1.1rem; }
  .modal .field { margin-bottom: 0.85rem; }
  .modal label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem; }
  .modal input {
    width: 100%; padding: 0.6rem 0.75rem;
    border: 1px solid var(--rule); border-radius: 6px;
    font-family: inherit; font-size: 0.9rem; color: var(--text);
    background: #ffffff;
  }
  .modal input:focus { outline: 2px solid var(--navy); outline-offset: 1px; border-color: var(--navy); }
  .field-hint { font-size: 0.72rem; color: var(--muted); margin: 0.25rem 0 0; }
  .modal-error {
    color: var(--bad); font-size: 0.85rem; line-height: 1.45;
    margin: 0.6rem 0 0; min-height: 1em;
  }
  .modal-error:empty { display: none; }
  .modal-actions { margin-top: 1.1rem; }
  .modal-submit {
    background: var(--navy); color: #ffffff; border: 0;
    padding: 0.75rem 1.25rem; font: inherit; font-weight: 600; font-size: 0.95rem;
    border-radius: 8px; cursor: pointer; width: 100%;
  }
  .modal-submit:hover:not(:disabled) { filter: brightness(1.15); }
  .modal-submit:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .modal-submit:disabled { opacity: 0.65; cursor: progress; }
  .modal-note { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 1rem 0 0; }
  .modal-note a { color: var(--navy); font-weight: 500; }

  .success-banner {
    position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
    z-index: 200; max-width: calc(100% - 2rem);
    background: var(--good); color: #ffffff; font-size: 0.9rem; font-weight: 500;
    padding: 0.7rem 1.1rem; border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
  }
  .success-banner[hidden] { display: none; }

  /* ---------- Print ---------- */
  @media print {
    @page { margin: 0.6in; }
    body { background: #ffffff; color: #000000; font-family: Georgia, 'Times New Roman', serif; line-height: 1.5; }
    .page-header, .pdf-btn, .calendly-cta, .page-footer, .no-print,
    .modal-backdrop, .success-banner { display: none !important; }
    main { max-width: 100%; padding: 0; }
    h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; color: #000; page-break-after: avoid; }
    p { color: #000; }
    .avg-score, .stat-tile, .callout, .estimate, .calendly-cta, .critical-callout, .page-section, table { background: transparent !important; box-shadow: none !important; }
    .stat-tile, .avg-score, .estimate, .callout, .critical-callout { border: 1px solid #999; }
    .badge { border: 1px solid #555; color: #000 !important; background: transparent !important; }
    .snippet { background: #f4f4f4; color: #000; }
    table, tr, .page-section, .critical-callout, .estimate { page-break-inside: avoid; }
    th { background: transparent !important; border-bottom: 1.5px solid #000; }
    a { color: #000; text-decoration: underline; }
    .target { color: #000; }
    .bar-fill { background: #555 !important; }
    .bar-track { background: #ddd !important; }
  }
</style>
</head>
<body>

<header class="page-header">
  <div style="display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap">
    <a href="https://evidenta11y.com" class="logo">Evidenta11y</a>
    <a href="https://evidenta11y.com" class="home-link">evidenta11y.com</a>
  </div>
  <button class="pdf-btn no-print" type="button" onclick="window.print()">Download as PDF</button>
</header>

<main id="report-root" aria-live="polite">
  <p class="state" role="status">Loading report…</p>
</main>

<footer class="page-footer">
  <a href="https://evidenta11y.com">Evidenta11y.com</a>
  &nbsp;|&nbsp;
  <a href="mailto:help@evidenta11y.com">help@evidenta11y.com</a>
  &nbsp;|&nbsp;
  760-790-8076
</footer>

<!-- Toast that fires after a successful signup -->
<div id="successBanner" class="success-banner" role="status" aria-live="polite" hidden></div>

<!-- Signup modal: opened by `evi-signup-required` events from <evi-audit-table> -->
<div
  id="signupModal"
  class="modal-backdrop"
  hidden
  role="presentation"
>
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="signupTitle"
    aria-describedby="signupSub signupError"
  >
    <button
      type="button"
      class="modal-close"
      aria-label="Close signup dialog"
      data-signup-close
    >&times;</button>

    <h2 id="signupTitle" class="modal-title">Create a free account to track remediation</h2>
    <p id="signupSub" class="modal-sub">
      Save your progress on every issue. No credit card required — your free account never expires.
    </p>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="signup-name">Name</label>
        <input
          id="signup-name"
          name="name"
          type="text"
          autocomplete="name"
          required
          minlength="1"
          maxlength="255"
          aria-required="true"
        >
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input
          id="signup-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          aria-required="true"
        >
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input
          id="signup-password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          minlength="8"
          aria-required="true"
          aria-describedby="signup-password-hint"
        >
        <p id="signup-password-hint" class="field-hint">At least 8 characters.</p>
      </div>

      <p id="signupError" class="modal-error" role="alert" aria-live="assertive"></p>

      <div class="modal-actions">
        <button type="submit" class="modal-submit">Create account</button>
      </div>

      <p class="modal-note">
        Already have an account?
        <a href="https://evidenta11y.com/login">Log in</a>
      </p>
    </form>
  </div>
</div>

<script>
  const API_BASE = 'https://platform-production-ace5.up.railway.app';

  // ---------- entry ----------
  function getToken() {
    const m = window.location.pathname.match(/^\/reports\/([^/?#]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  async function init() {
    const root = document.getElementById('report-root');
    const token = getToken();
    if (!token) {
      renderState(root, 'No report token', 'The link is missing a report identifier.');
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/v1/public/report/view/${encodeURIComponent(token)}`);
      if (res.status === 404) {
        renderState(root, 'Report not found', 'The link may be invalid.');
        return;
      }
      if (res.status === 410) {
        renderState(root, 'Report expired', 'This report has expired. Reports are available for 30 days.');
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderReport(root, data);
    } catch (err) {
      renderState(root, "Couldn't load report", (err && err.message) || 'Please try again later.');
    }
  }

  function renderState(root, heading, body) {
    root.innerHTML = `
      <div class="state" role="status">
        <h2>${escapeHtml(heading)}</h2>
        <p>${escapeHtml(body)}</p>
      </div>`;
  }

  // ---------- helpers ----------
  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]);
  }

  function safeHostname(url) {
    try { return new URL(url).hostname; } catch { return url || ''; }
  }

  function formatDateLong(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  // Score color thresholds — all WCAG 2.1 AA on white:
  //   #1a7a5e (5.28:1)  #8a5a00 (5.94:1)  #c0392b (5.50:1)
  function scoreColor(score) {
    if (score == null) return 'var(--muted)';
    if (score >= 80) return 'var(--good)';
    if (score >= 50) return 'var(--warn)';
    return 'var(--bad)';
  }

  function impactBadge(impact) {
    const cls = ['critical', 'serious', 'moderate', 'minor'].includes(impact) ? impact : 'minor';
    const label = (cls || 'unknown').toUpperCase();
    return `<span class="badge badge-${cls}">${label}</span>`;
  }

  function cleanFailureSummary(text) {
    return String(text || '')
      .replace(/^Fix any of the following:\s*\n?/i, '')
      .replace(/^Fix all of the following:\s*\n?/i, '')
      .trim();
  }

  function formatWcagTags(tags) {
    const scMap = {
      wcag111:'1.1.1', wcag121:'1.2.1', wcag122:'1.2.2', wcag123:'1.2.3',
      wcag124:'1.2.4', wcag125:'1.2.5', wcag131:'1.3.1', wcag132:'1.3.2',
      wcag133:'1.3.3', wcag134:'1.3.4', wcag135:'1.3.5', wcag141:'1.4.1',
      wcag142:'1.4.2', wcag143:'1.4.3', wcag144:'1.4.4', wcag145:'1.4.5',
      wcag1410:'1.4.10', wcag1411:'1.4.11', wcag1412:'1.4.12', wcag1413:'1.4.13',
      wcag211:'2.1.1', wcag212:'2.1.2', wcag214:'2.1.4', wcag221:'2.2.1',
      wcag222:'2.2.2', wcag231:'2.3.1', wcag241:'2.4.1', wcag242:'2.4.2',
      wcag243:'2.4.3', wcag244:'2.4.4', wcag245:'2.4.5', wcag246:'2.4.6',
      wcag247:'2.4.7', wcag251:'2.5.1', wcag252:'2.5.2', wcag253:'2.5.3',
      wcag254:'2.5.4', wcag311:'3.1.1', wcag312:'3.1.2', wcag321:'3.2.1',
      wcag322:'3.2.2', wcag323:'3.2.3', wcag324:'3.2.4', wcag331:'3.3.1',
      wcag332:'3.3.2', wcag333:'3.3.3', wcag334:'3.3.4', wcag411:'4.1.1',
      wcag412:'4.1.2', wcag413:'4.1.3'
    };
    const lvlMap = {
      wcag2a:'WCAG 2.0 A', wcag2aa:'WCAG 2.0 AA', wcag2aaa:'WCAG 2.0 AAA',
      wcag21a:'WCAG 2.1 A', wcag21aa:'WCAG 2.1 AA', wcag21aaa:'WCAG 2.1 AAA',
      wcag22aa:'WCAG 2.2 AA'
    };
    const out = [];
    (tags || []).forEach(t => {
      if (lvlMap[t]) out.push(lvlMap[t]);
      else if (scMap[t]) out.push(`SC ${scMap[t]}`);
    });
    return out;
  }

  // ---------- aggregation ----------
  function aggregateViolations(pages) {
    const map = new Map();
    for (const page of (pages || [])) {
      const violations = Array.isArray(page.violations) ? page.violations : [];
      const seen = new Set();
      for (const v of violations) {
        if (!v || !v.id) continue;
        let agg = map.get(v.id);
        if (!agg) {
          agg = { id: v.id, help: v.help || v.id, impact: v.impact, total_nodes: 0, pages_affected: 0 };
          map.set(v.id, agg);
        }
        const nodes = Array.isArray(v.nodes) ? v.nodes.length : 0;
        agg.total_nodes += nodes;
        if (!seen.has(v.id)) { agg.pages_affected += 1; seen.add(v.id); }
      }
    }
    return Array.from(map.values());
  }

  function topByNodes(arr, n) { return [...arr].sort((a,b) => b.total_nodes - a.total_nodes).slice(0, n); }
  function topByPages(arr, n) {
    return [...arr].sort((a,b) => b.pages_affected - a.pages_affected || b.total_nodes - a.total_nodes).slice(0, n);
  }

  function estimateRemediation(total) {
    if (total <= 0) return null;
    if (total < 20) return '2–4 hours';
    if (total <= 50) return '4–8 hours';
    if (total <= 100) return '8–16 hours';
    return '16–32 hours';
  }

  // ---------- rendering ----------
  function renderReport(root, data) {
    const domain = safeHostname(data.url || '');
    document.title = `Accessibility Report for ${domain} — Evidenta11y`;

    const totalViolations = data.total_violations ?? 0;
    const aggregated = aggregateViolations(data.pages);
    const criticalAgg = aggregated.filter(v => v.impact === 'critical');

    const avg = data.avg_score == null ? '—' : data.avg_score;
    const avgClr = scoreColor(data.avg_score);

    root.innerHTML = `
      <header class="report-header">
        <p class="label">Accessibility report</p>
        <h1>Accessibility Report for ${escapeHtml(domain)}</h1>
        <p class="meta url"><strong>URL:</strong> <a href="${escapeHtml(data.url || '#')}" target="_blank" rel="noopener">${escapeHtml(data.url || '')}</a></p>
        <p class="meta"><strong>Scanned:</strong> ${escapeHtml(formatDateLong(data.scanned_at))}</p>
        <p class="meta"><strong>Report expires:</strong> ${escapeHtml(formatDateLong(data.expires_at))}</p>
      </header>

      <section aria-labelledby="summary-h">
        <h2 id="summary-h" class="sr-only">Summary</h2>
        <div class="avg-score">
          <div class="label">Average score</div>
          <div class="value" style="color:${avgClr}">${escapeHtml(String(avg))}</div>
        </div>
        <div class="stats" role="presentation">
          <div class="stat-tile"><div class="v">${escapeHtml(`${data.pages_scanned ?? 0}/${data.pages_total ?? 0}`)}</div><div class="l">Pages scanned</div></div>
          <div class="stat-tile"><div class="v">${escapeHtml(String(totalViolations))}</div><div class="l">Total violations</div></div>
          <div class="stat-tile"><div class="v" style="color:${(data.critical_count ?? 0) > 0 ? 'var(--bad)' : 'var(--text)'}">${escapeHtml(String(data.critical_count ?? 0))}</div><div class="l">Critical</div></div>
          <div class="stat-tile"><div class="v" style="color:${(data.serious_count ?? 0) > 0 ? 'var(--warn)' : 'var(--text)'}">${escapeHtml(String(data.serious_count ?? 0))}</div><div class="l">Serious</div></div>
        </div>
      </section>

      <section aria-labelledby="disclaimer-h">
        <h2 id="disclaimer-h" class="sr-only">Disclaimer</h2>
        <div class="callout">
          <p><strong>About this report:</strong> this is an automated accessibility scan. Automated testing catches roughly 30–40% of accessibility issues; the remainder require manual review by a specialist. A passing score does not guarantee compliance with WCAG or the ADA.</p>
        </div>
      </section>

      ${renderCriticalCallout(criticalAgg)}
      ${renderCommonIssues(aggregated)}
      ${renderTopPriority(aggregated)}
      ${renderEstimate(totalViolations)}
      ${renderPerPage(data.pages || [])}

      <section class="calendly-cta" aria-labelledby="cta-h">
        <h2 id="cta-h">Want help with these results?</h2>
        <p>Book a free 30-minute consultation to walk through the findings and discuss next steps.</p>
        <a href="https://calendly.com/hello-evidenta11y/30min" target="_blank" rel="noopener">Speak with a pro &rarr;</a>
      </section>
    `;

    // Hand data to the Lit table component (it may not be upgraded yet — Lit
    // applies the properties when the custom element registers).
    const table = root.querySelector('#auditTable');
    if (table) {
      table.findings = flattenFindings(data.pages || []);
      table.mode = 'report';
      table.claimed = !!data.claimed;
      table.token = getToken() || '';
    }
  }

  // ---------- Signup modal ----------
  let __signupReturnFocus = null;

  function openSignup(triggerEl) {
    const modal = document.getElementById('signupModal');
    if (!modal) return;
    __signupReturnFocus = triggerEl || document.activeElement;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    // Reset error + button label from any previous attempt
    const errEl = document.getElementById('signupError');
    if (errEl) errEl.textContent = '';
    const submitBtn = modal.querySelector('button[type="submit"]');
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
    // Focus the first input — wait a tick so the element is actually shown
    setTimeout(() => {
      const first = modal.querySelector('input');
      if (first) first.focus();
    }, 0);
    document.addEventListener('keydown', _signupKeyHandler);
  }

  function closeSignup() {
    const modal = document.getElementById('signupModal');
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    document.body.style.overflow = '';
    document.removeEventListener('keydown', _signupKeyHandler);
    // Return focus to whatever opened the modal, if it's still in the DOM.
    if (
      __signupReturnFocus &&
      __signupReturnFocus.isConnected &&
      typeof __signupReturnFocus.focus === 'function'
    ) {
      try { __signupReturnFocus.focus(); } catch { /* ignore */ }
    }
    __signupReturnFocus = null;
  }

  function _focusableInModal() {
    const modal = document.getElementById('signupModal');
    if (!modal) return [];
    return Array.from(
      modal.querySelectorAll(
        'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )
    ).filter(el => !el.hasAttribute('hidden'));
  }

  function _signupKeyHandler(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeSignup();
      return;
    }
    if (e.key !== 'Tab') return;
    const items = _focusableInModal();
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    const active = document.activeElement;
    if (e.shiftKey && (active === first || !items.includes(active))) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && active === last) {
      e.preventDefault();
      first.focus();
    }
  }

  // Trigger 1: locked remediation dropdown inside the audit table
  document.addEventListener('evi-signup-required', (e) => {
    // composedPath()[0] is the actual element inside the shadow DOM that
    // fired the click. Calling .focus() on a held reference still works
    // across the shadow boundary, so we capture it for return-focus.
    const trigger = (e.composedPath && e.composedPath()[0]) || document.activeElement;
    openSignup(trigger);
  });

  // Trigger 2 + close-button delegation
  document.addEventListener('click', (e) => {
    const t = e.target instanceof Element ? e.target.closest('[data-open-signup]') : null;
    if (t) {
      e.preventDefault();
      openSignup(t);
      return;
    }
    const c = e.target instanceof Element ? e.target.closest('[data-signup-close]') : null;
    if (c) {
      e.preventDefault();
      closeSignup();
    }
  });

  // Backdrop click closes (clicks inside the .modal don't bubble to the backdrop
  // because we check e.target === backdrop)
  const signupBackdrop = document.getElementById('signupModal');
  if (signupBackdrop) {
    signupBackdrop.addEventListener('click', (e) => {
      if (e.target === signupBackdrop) closeSignup();
    });
  }

  // Submit handler
  const signupForm = document.getElementById('signupForm');
  if (signupForm) {
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('signupError');
      const submitBtn = signupForm.querySelector('button[type="submit"]');
      if (!errEl || !submitBtn) return;
      errEl.textContent = '';

      const name = (signupForm.elements.namedItem('name')?.value || '').trim();
      const email = (signupForm.elements.namedItem('email')?.value || '').trim().toLowerCase();
      const password = signupForm.elements.namedItem('password')?.value || '';
      const token = getToken() || '';

      if (!token) {
        errEl.textContent = "We couldn't read this report's token. Please reload the page.";
        return;
      }
      if (!name || !email || password.length < 8) {
        errEl.textContent = 'Please complete all fields. Passwords must be at least 8 characters.';
        return;
      }

      submitBtn.disabled = true;
      const prevLabel = submitBtn.textContent;
      submitBtn.textContent = 'Creating account…';

      try {
        const res = await fetch(`${API_BASE}/v1/public/report/claim`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, name, email, password }),
        });
        const json = await res.json().catch(() => ({}));

        if (res.status === 409) {
          errEl.textContent = 'An account with this email already exists. Please log in.';
          return;
        }
        if (!res.ok) {
          errEl.textContent = 'Something went wrong. Please try again.';
          return;
        }

        try {
          if (json.token) localStorage.setItem('evi-auth-token', json.token);
          if (json.customer_id) localStorage.setItem('evi-auth-customer-id', json.customer_id);
          if (json.email) localStorage.setItem('evi-auth-email', json.email);
        } catch { /* localStorage may be unavailable */ }

        // Flip the audit table to claimed so dropdowns become editable.
        const table = document.querySelector('#auditTable');
        if (table) table.claimed = true;

        closeSignup();
        showSuccessBanner(
          'Account created! Your remediation progress will now be saved.'
        );
        signupForm.reset();
      } catch {
        errEl.textContent = 'Something went wrong. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = prevLabel;
      }
    });
  }

  function showSuccessBanner(text) {
    const banner = document.getElementById('successBanner');
    if (!banner) return;
    banner.textContent = text;
    banner.hidden = false;
    clearTimeout(showSuccessBanner._t);
    showSuccessBanner._t = setTimeout(() => { banner.hidden = true; }, 6000);
  }

  function renderCriticalCallout(critical) {
    if (!critical.length) return '';
    const items = critical.map(v => {
      const word = v.pages_affected === 1 ? 'page' : 'pages';
      return `<li><strong>${escapeHtml(v.help)}</strong><span class="meta"> — found on ${v.pages_affected} ${word}</span></li>`;
    }).join('');
    return `
      <section class="critical-callout" aria-labelledby="critical-h">
        <h2 id="critical-h" class="heading">🔴 Critical Issues — Immediate Attention Required</h2>
        <p style="font-size:0.875rem;margin-bottom:0.6rem">These violations represent the most severe barriers for users with disabilities and must be resolved before claiming WCAG compliance.</p>
        <ul>${items}</ul>
      </section>`;
  }

  function renderCommonIssues(aggregated) {
    if (!aggregated.length) return '';
    const top = topByNodes(aggregated, 5);
    const max = Math.max(1, ...top.map(v => v.total_nodes));
    const rows = top.map(v => {
      const pct = Math.max(4, Math.round((v.total_nodes / max) * 100));
      const word = v.total_nodes === 1 ? 'instance' : 'instances';
      return `
        <tr>
          <td>${escapeHtml(v.help)}</td>
          <td><div role="presentation" aria-hidden="true" class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></td>
          <td class="num">${v.total_nodes} ${word}</td>
        </tr>`;
    }).join('');
    return `
      <section aria-labelledby="common-h">
        <h2 id="common-h">Most common issues</h2>
        <p class="muted" style="margin-bottom:0.5rem">Total instances found across all scanned pages.</p>
        <table>
          <caption class="sr-only">Top 5 most common violations across all pages</caption>
          <thead><tr><th scope="col">Issue</th><th scope="col">Distribution</th><th scope="col" class="num">Instances</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>`;
  }

  function renderTopPriority(aggregated) {
    if (!aggregated.length) return '';
    const top = topByPages(aggregated, 3);
    const items = top.map((v, i) => {
      const word = v.pages_affected === 1 ? 'page' : 'pages';
      return `<li><strong>${i + 1}. ${escapeHtml(v.help)}</strong><span class="meta"> — found on ${v.pages_affected} ${word}</span></li>`;
    }).join('');
    return `
      <section aria-labelledby="priority-h">
        <h2 id="priority-h">Top priority fixes</h2>
        <p class="muted" style="margin-bottom:0.5rem">Resolving these will eliminate the most violations across the most pages.</p>
        <ol class="priority">${items}</ol>
      </section>`;
  }

  function renderEstimate(totalViolations) {
    const est = estimateRemediation(totalViolations);
    if (!est) return '';
    return `
      <section aria-labelledby="estimate-h">
        <h2 id="estimate-h" class="sr-only">Remediation estimate</h2>
        <div class="estimate">
          <div class="h">Estimated remediation: ${escapeHtml(est)}</div>
          <div class="b">Many issues likely stem from your sitewide template. Fixing the template once could resolve issues across multiple pages simultaneously.</div>
        </div>
      </section>`;
  }

  function renderPerPage(pages) {
    if (!pages.length) return '';
    const hasFindings = pages.some(p => Array.isArray(p.violations) && p.violations.length > 0);
    if (!hasFindings) {
      return `
        <section aria-labelledby="pages-h">
          <h2 id="pages-h">Per-page results</h2>
          <p class="no-violations">No detailed violation data is available for these pages yet.</p>
        </section>`;
    }
    return `
      <section aria-labelledby="pages-h">
        <h2 id="pages-h">Per-page results</h2>
        <evi-audit-table id="auditTable"></evi-audit-table>
      </section>`;
  }

  // Flatten data.pages[] into per-finding rows. Axe violations expand to one
  // row per (violation, node); Claude AI findings are 1:1 with their own row.
  function flattenFindings(pages) {
    const out = [];
    for (const page of (pages || [])) {
      const violations = Array.isArray(page.violations) ? page.violations : [];
      for (const v of violations) {
        const nodes = Array.isArray(v.nodes) && v.nodes.length ? v.nodes : [{}];
        for (const node of nodes) {
          out.push({
            page: page.url || '',
            testType: 'Automated',
            impact: v.impact,
            tags: v.tags,
            help: v.help || v.id,
            description: v.description,
            failureSummary: node.failureSummary,
            html: node.html,
            target: node.target,
          });
        }
      }
      const claudeFindings = Array.isArray(page.claude_findings) ? page.claude_findings : [];
      for (const f of claudeFindings) {
        out.push({
          page: page.url || '',
          testType: 'AI',
          impact: f.severity,
          wcagSc: f.wcag_sc,
          wcagName: f.wcag_name,
          help: f.issue,
          description: f.fix,
          failureSummary: `${f.issue} (Confidence: ${f.confidence})`,
          html: f.element,
          target: '',
          confidence: f.confidence,
        });
      }
    }
    return out;
  }

  init();
</script>

    constructor() {
      super();
      this.findings = [];
      this.mode = 'report';
      this.claimed = false;
      this.token = '';
      this._sortColumn = 'impact';
      this._sortDir = 'asc'; // asc → critical first (rank 0)
      this._statuses = {};
    }

    willUpdate(changed) {
      if (changed.has('findings') || changed.has('token') || changed.has('claimed')) {
        this._loadStatuses();
      }
    }

    _storageKey(pageUrl, issueNum) {
      return `${this.token}:${pageUrl}:${issueNum}`;
    }

    _loadStatuses() {
      if (!this.claimed || !this.token) { this._statuses = {}; return; }
      const out = {};
      const groups = this._groupByPage(this.findings);
      for (const [page, items] of groups) {
        items.forEach((_, i) => {
          const key = this._storageKey(page, i + 1);
          try {
            const v = localStorage.getItem(key);
            if (v) out[key] = v;
          } catch { /* localStorage may be unavailable */ }
        });
      }
      this._statuses = out;
    }

    _groupByPage(findings) {
      const map = new Map();
      for (const f of (findings || [])) {
        const k = f.page || '(no page)';
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(f);
      }
      return map;
    }

    _formatWcag(f) {
      // AI findings carry wcagSc directly; render as "SC X.Y.Z".
      if (f && f.wcagSc) return `SC ${f.wcagSc}`;
      const tags = f && Array.isArray(f.tags) ? f.tags : [];
      const out = [];
      for (const t of tags) {
        const m = /^wcag(2|21|22)?(a{1,3})$/.exec(t);
        if (m) {
          out.push(`WCAG 2.2 ${m[2].toUpperCase()}`);
        } else if (SC_MAP[t]) {
          out.push(`SC ${SC_MAP[t]}`);
        }
      }
      return [...new Set(out)].join(' · ');
    }

    _cleanFailureSummary(text) {
      return String(text || '')
        .replace(/^Fix any of the following:\s*\n?/i, '')
        .replace(/^Fix all of the following:\s*\n?/i, '')
        .trim();
    }

    _truncate(str, n) {
      const s = String(str || '');
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    _sortKey(col, f, pageUrl, issueNum) {
      switch (col) {
        case 'issue': return issueNum;
        case 'testType': return (f.testType || '').toLowerCase();
        case 'impact': return IMPACT_RANK[f.impact] ?? 99;
        case 'wcag': return this._formatWcag(f);
        case 'summary': return (f.help || '').toLowerCase();
        case 'problem': return this._cleanFailureSummary(f.failureSummary).toLowerCase();
        case 'expected': return (f.description || '').toLowerCase();
        case 'failingElement':
          return ((Array.isArray(f.target) && f.target[0]) || f.html || '').toLowerCase();
        case 'remediation': {
          const status = this._statuses[this._storageKey(pageUrl, issueNum)] || REMEDIATION[0];
          return REMEDIATION.indexOf(status);
        }
        case 'screenshot':
        default:
          return 0;
      }
    }

    _onSortClick(col) {
      if (this._sortColumn === col) {
        this._sortDir = this._sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        this._sortColumn = col;
        this._sortDir = 'asc';
      }
    }

    _onSortKey(e, col) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this._onSortClick(col);
      }
    }

    _onRemediationChange(e, key) {
      const val = e.target.value;
      try { localStorage.setItem(key, val); } catch { /* ignore */ }
      this._statuses = { ...this._statuses, [key]: val };
    }

    _onLockedClick(e) {
      e.preventDefault();
      this.dispatchEvent(new CustomEvent('evi-signup-required', {
        bubbles: true, composed: true,
      }));
    }

    _onLockedKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this._onLockedClick(e);
      }
    }

    _renderHeader(col, label) {
      const active = this._sortColumn === col;
      const arrow = active ? (this._sortDir === 'asc' ? '▲' : '▼') : '';
      return html`
        <th
          scope="col"
          class=${active ? 'active' : ''}
          tabindex="0"
          role="button"
          aria-sort=${active ? (this._sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}
          @click=${() => this._onSortClick(col)}
          @keydown=${(e) => this._onSortKey(e, col)}
        >${label}<span class="arrow" aria-hidden="true">${arrow}</span></th>
      `;
    }

    _renderImpact(impact) {
      const cls = IMPACT_LABEL[impact] ? `badge-${impact}` : 'badge-unknown';
      const label = IMPACT_LABEL[impact] || 'UNKNOWN';
      return html`<span class="badge ${cls}">${label}</span>`;
    }

    _renderTestType(f) {
      const t = (f && f.testType) || 'Automated';
      const cls = `test-type-${String(t).toLowerCase()}`;
      const conf = f && f.confidence;
      const confLabel = conf
        ? `${conf.charAt(0).toUpperCase()}${conf.slice(1).toLowerCase()} confidence`
        : '';
      return html`
        <div class="testtype-cell">
          <span class="test-type ${cls}">${t}</span>
          ${confLabel ? html`<span class="confidence">${confLabel}</span>` : ''}
        </div>
      `;
    }

    _renderRemediation(key) {
      const current = this._statuses[key] || REMEDIATION[0];
      if (this.claimed) {
        return html`
          <select
            aria-label="Remediation status"
            .value=${current}
            @change=${(e) => this._onRemediationChange(e, key)}
          >
            ${REMEDIATION.map(opt => html`
              <option value=${opt} ?selected=${opt === current}>${opt}</option>
            `)}
          </select>
        `;
      }
      return html`
        <span
          class="locked-select"
          role="button"
          tabindex="0"
          title="Create a free account to track remediation progress"
          aria-label="Create a free account to track remediation progress"
          @click=${this._onLockedClick}
          @keydown=${this._onLockedKey}
        >
          <select disabled aria-disabled="true" tabindex="-1">
            <option>${current}</option>
          </select>
          <span class="lock" aria-hidden="true">🔒</span>
        </span>
      `;
    }

    _renderRow(f, pageUrl, issueNum) {
      const wcag = this._formatWcag(f);
      const problem = this._cleanFailureSummary(f.failureSummary);
      const target = Array.isArray(f.target) ? f.target.join(', ') : '';
      const key = this._storageKey(pageUrl, issueNum);
      return html`
        <tr>
          <td class="num">${issueNum}</td>
          <td>${this._renderTestType(f)}</td>
          <td>${this._renderImpact(f.impact)}</td>
          <td>
            <span class="wcag">${wcag}${f.wcagName ? html`<span class="wcag-name">${f.wcagName}</span>` : ''}</span>
          </td>
          <td class="summary">${f.help || ''}</td>
          <td class="problem">${problem}</td>
          <td class="expected">${f.description || ''}</td>
          <td>
            ${f.html ? html`<code class="snippet">${this._truncate(f.html, 200)}</code>` : ''}
            ${target ? html`<div class="target">${target}</div>` : ''}
          </td>
          <td><span class="muted">Not available</span></td>
          <td>${this._renderRemediation(key)}</td>
        </tr>
      `;
    }

    _renderPageGroup(pageUrl, items) {
      // Assign a stable issue number based on the original (unsorted) order so
      // the localStorage key doesn't drift when the user re-sorts the table.
      const numbered = items.map((f, i) => ({ ...f, _issue: i + 1 }));
      const sorted = [...numbered].sort((a, b) => {
        const va = this._sortKey(this._sortColumn, a, pageUrl, a._issue);
        const vb = this._sortKey(this._sortColumn, b, pageUrl, b._issue);
        if (va < vb) return this._sortDir === 'asc' ? -1 : 1;
        if (va > vb) return this._sortDir === 'asc' ? 1 : -1;
        return a._issue - b._issue;
      });
      return html`
        <details open>
          <summary>${pageUrl}<span class="count">— ${items.length} ${items.length === 1 ? 'issue' : 'issues'}</span></summary>
          <div class="table-wrap">
            <table>
              <caption class="sr-only">Findings for ${pageUrl}</caption>
              <thead>
                <tr>
                  ${this._renderHeader('issue', 'Issue #')}
                  ${this._renderHeader('testType', 'Test Type')}
                  ${this._renderHeader('impact', 'Impact')}
                  ${this._renderHeader('wcag', 'WCAG SC')}
                  ${this._renderHeader('summary', 'Summary')}
                  ${this._renderHeader('problem', 'Problem')}
                  ${this._renderHeader('expected', 'Expected')}
                  ${this._renderHeader('failingElement', 'Failing element')}
                  ${this._renderHeader('screenshot', 'Screenshot')}
                  ${this._renderHeader('remediation', 'Remediation')}
                </tr>
              </thead>
              <tbody>
                ${sorted.map(f => this._renderRow(f, pageUrl, f._issue))}
              </tbody>
            </table>
          </div>
        </details>
      `;
    }

    render() {
      if (!this.findings || !this.findings.length) {
        return html`<p class="empty">No detailed findings available.</p>`;
      }
      const groups = this._groupByPage(this.findings);
      return html`${[...groups].map(([url, items]) => this._renderPageGroup(url, items))}`;
    }
  }

  customElements.define('evi-audit-table', EviAuditTable);
</script>

</body>
</html>
