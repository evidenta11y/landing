<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reports — evidenta11y</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f0f2f8;
  --surface: #ffffff;
  --surface-2: #f0f2f8;
  --surface-3: #e4e8f0;
  --ink: #0a0f2e;
  --ink-2: #2d3561;
  --ink-3: #5c6589;
  --ink-4: #9ca3af;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --accent: #00d4a0;
  --accent-dark: #00b386;
  --font-display: 'Inter Tight', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --moderate-bg: #E6F1FB;
  --moderate-fg: #0C447C;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  font-feature-settings: "ss01", "cv11";
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  overflow-y: auto;
}
.sidebar-brand {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--line);
}
.sidebar-brand-name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
  display: block;
}
.sidebar-brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  display: block;
  margin-top: 2px;
}
.sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  text-decoration: none;
  transition: background 0.1s, color 0.1s;
  background: none;
  border: none;
  cursor: pointer;
  width: 100%;
  font-family: var(--font-display);
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.nav-item.active {
  background: var(--surface-2);
  color: var(--ink);
}
.nav-item svg {
  flex-shrink: 0;
  opacity: 0.7;
}
.nav-item.active svg {
  opacity: 1;
}
.nav-item.nav-logout {
  color: var(--ink-4);
}
.nav-item.nav-logout:hover {
  color: #791F1F;
  background: #FCEBEB;
}
.sidebar-footer {
  padding: 14px 10px;
  border-top: 1px solid var(--line);
}

.main {
  margin-left: 220px;
  flex: 1;
  padding: 36px 40px 64px;
  min-width: 0;
  overflow-y: auto;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.page-header-left h1 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: var(--ink);
}
.page-header-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin: 0;
}
.page-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
#search {
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 13px;
  font-family: var(--font-display);
  color: var(--ink);
  background: var(--surface);
  outline: none;
  width: 260px;
  transition: border-color 0.15s;
}
#search::placeholder {
  color: var(--ink-4);
}
#search:focus {
  border-color: var(--accent);
}
#refresh-btn {
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  cursor: pointer;
  transition: border-color 0.1s, color 0.1s, background 0.1s;
  white-space: nowrap;
}
#refresh-btn:hover {
  border-color: var(--ink-4);
  color: var(--ink);
  background: var(--surface-2);
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.reports-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.reports-table th {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-4);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
.reports-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.reports-table tbody tr:last-child td {
  border-bottom: none;
}

.group-row {
  cursor: pointer;
  background: var(--surface);
}
.group-row:hover {
  background: var(--surface-2);
}
.group-chevron {
  width: 14px;
  height: 14px;
  color: var(--ink-4);
  transition: transform 0.15s;
  flex-shrink: 0;
  display: block;
}
.group-row.is-open .group-chevron {
  transform: rotate(90deg);
}
.group-domain {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.group-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
  margin-top: 2px;
}

.sub-row td {
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.sub-row .url-cell {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
  margin-top: 2px;
}

.type-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
}
.type-scan {
  background: var(--moderate-bg);
  color: var(--moderate-fg);
}
.type-manual {
  background: var(--surface-3);
  color: var(--ink-2);
}

.score-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 24px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
}
.score-high { background: #e5f0dd; color: #2D6B2D; }
.score-mid  { background: #FAEEDA; color: #6B3A05; }
.score-low  { background: #FCEBEB; color: #791F1F; }
.score-none { background: var(--surface-3); color: var(--ink-4); }

.status-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
}
.status-complete  { background: #e5f0dd; color: #2D6B2D; }
.status-queued    { background: var(--surface-3); color: var(--ink-3); }
.status-scanning  { background: #E6F1FB; color: #0C447C; }
.status-failed    { background: #FCEBEB; color: #791F1F; }

.open-btn {
  display: inline-flex;
  padding: 5px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  text-decoration: none;
  background: none;
  transition: background 0.1s, border-color 0.1s;
  white-space: nowrap;
}
.open-btn:hover {
  background: var(--surface-2);
  border-color: var(--ink-4);
}

.row-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.kebab-wrap {
  position: relative;
}
.kebab-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: none;
  border: 1px solid transparent;
  border-radius: 5px;
  font-size: 16px;
  color: var(--ink-4);
  cursor: pointer;
  padding: 0;
  line-height: 1;
  letter-spacing: 0;
}
.kebab-btn:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface-2);
}
.kebab-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  z-index: 200;
  min-width: 150px;
  padding: 4px 0;
}
.kebab-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 14px;
  background: none;
  border: none;
  font: inherit;
  font-size: 13px;
  color: var(--ink-3);
  cursor: pointer;
  white-space: nowrap;
}
.kebab-menu button:hover { background: var(--surface-2); color: var(--ink); }
.kebab-menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
.kebab-delete { color: #791F1F !important; }
.kebab-delete:hover { background: #FCEBEB !important; }

.rename-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
}
.rename-dialog {
  background: var(--surface);
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.18);
  width: 360px;
  padding: 24px;
}
.rename-dialog h2 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 14px;
}
.rename-dialog input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  outline: none;
  margin-bottom: 16px;
}
.rename-dialog input:focus { border-color: var(--accent); }
.rename-dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.btn-secondary {
  padding: 7px 14px;
  background: none;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
}
.btn-secondary:hover { background: var(--surface-2); }
.btn-primary-sm {
  padding: 7px 14px;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
}
.btn-primary-sm:hover { background: var(--accent-dark); }

.empty-state {
  padding: 56px 24px;
  text-align: center;
}
.empty-state-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 6px;
}
.empty-state-body {
  font-size: 13px;
  color: var(--ink-3);
  margin: 0;
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="sidebar-brand-name">evidenta11y</span>
    <span class="sidebar-brand-sub">Accessibility Platform</span>
  </div>
  <nav class="sidebar-nav" aria-label="Primary">
    <a class="nav-item" href="/app/">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="6" height="6" rx="1" fill="currentColor"/>
        <rect x="9" y="1" width="6" height="6" rx="1" fill="currentColor"/>
        <rect x="1" y="9" width="6" height="6" rx="1" fill="currentColor"/>
        <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/>
      </svg>
      Dashboard
    </a>
    <a class="nav-item active" href="/app/reports" aria-current="page">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="1" y="3" width="14" height="1.5" rx="0.75" fill="currentColor"/>
        <rect x="1" y="7.25" width="14" height="1.5" rx="0.75" fill="currentColor"/>
        <rect x="1" y="11.5" width="14" height="1.5" rx="0.75" fill="currentColor"/>
      </svg>
      Reports
    </a>
    <button class="nav-item nav-logout" id="logout-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 8H3M6 5l-3 3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 3h4a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      </svg>
      Logout
    </button>
  </nav>
  <div class="sidebar-footer">
    <a class="nav-item" href="/">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      evidenta11y.com
    </a>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div class="page-header-left">
      <h1>Reports</h1>
      <p class="page-header-sub">All scans and accessibility audits</p>
    </div>
    <div class="page-header-right">
      <button id="refresh-btn" onclick="loadReports()">↻ Refresh</button>
      <input id="search" type="search" placeholder="Filter by URL or audit name…" autocomplete="off" />
    </div>
  </div>

  <div id="reports-container"></div>
</main>

<script>
const API = 'https://platform-production-ace5.up.railway.app';

(function() {
  if (!localStorage.getItem('e11y_session')) {
    window.location.replace('/app/login');
  }
})();

document.getElementById('logout-btn').addEventListener('click', function() {
  localStorage.removeItem('e11y_session');
  window.location.replace('/app/login');
});

let query = '';
let apiReports = [];
const expandedGroups = new Set();

function hostname(url) {
  try { return new URL(url).hostname; } catch (e) { return url || ''; }
}

function scoreClass(score) {
  if (score === null || score === undefined) return 'score-none';
  if (score >= 90) return 'score-high';
  if (score >= 70) return 'score-mid';
  return 'score-low';
}

function statusChip(status) {
  const labels = { complete: 'Complete', queued: 'Queued', scanning: 'Scanning', failed: 'Failed' };
  const label = labels[status] || status;
  const cls = ['complete', 'queued', 'scanning', 'failed'].includes(status) ? status : 'queued';
  return `<span class="status-chip status-${cls}">${label}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function esc(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function buildGroups(reports, q) {
  let entries = reports.slice();
  if (q) {
    const lq = q.toLowerCase();
    entries = entries.filter(r => {
      if (hostname(r.url).toLowerCase().includes(lq)) return true;
      if ((r.url || '').toLowerCase().includes(lq)) return true;
      if ((r.manual_audits || []).some(a => (a.name || '').toLowerCase().includes(lq))) return true;
      return false;
    });
  }
  const map = new Map();
  for (const r of entries) {
    const d = hostname(r.url);
    if (!map.has(d)) map.set(d, []);
    map.get(d).push(r);
  }
  const groups = [];
  for (const [domain, reps] of map.entries()) {
    reps.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    groups.push({ domain, reports: reps });
  }
  groups.sort((a, b) => {
    const aDate = new Date(a.reports[0].created_at || 0);
    const bDate = new Date(b.reports[0].created_at || 0);
    return bDate - aDate;
  });
  return groups;
}

function render() {
  const container = document.getElementById('reports-container');

  if (apiReports.length === 0) {
    container.innerHTML = `<div class="section-card"><div class="empty-state"><p class="empty-state-title">No reports yet</p><p class="empty-state-body">Run a scan to see your first report here.</p></div></div>`;
    return;
  }

  const groups = buildGroups(apiReports, query);

  if (groups.length === 0) {
    container.innerHTML = `<div class="section-card"><div class="empty-state"><p class="empty-state-title">No reports match your search.</p></div></div>`;
    return;
  }

  let tbody = '';

  for (const group of groups) {
    const { domain, reports } = group;
    const isOpen = expandedGroups.has(domain);

    const scores = reports.map(r => r.avg_score).filter(s => s !== null && s !== undefined);
    const groupAvg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
    const groupScoreBadge = `<span class="score-badge ${scoreClass(groupAvg)}">${groupAvg !== null ? groupAvg : '—'}</span>`;

    const totalIssues = reports.reduce((sum, r) => {
      return sum + (r.manual_audits || []).reduce((s, a) => s + (a.findings_count || 0), 0);
    }, 0);

    const totalManualAudits = reports.reduce((sum, r) => sum + (r.manual_audits || []).length, 0);
    const subLabel = `${reports.length} scan${reports.length !== 1 ? 's' : ''}${totalManualAudits > 0 ? ' · ' + totalManualAudits + ' manual audit' + (totalManualAudits !== 1 ? 's' : '') : ''}`;

    const lastDate = fmtDate(reports[0].created_at);
    const escapedDomain = esc(domain);

    tbody += `<tr class="group-row${isOpen ? ' is-open' : ''}" data-domain="${escapedDomain}">
      <td style="width:30px;padding-right:4px;">
        <svg class="group-chevron" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </td>
      <td colspan="5">
        <div class="group-domain">${escapedDomain}</div>
        <div class="group-sub">${subLabel}</div>
      </td>
      <td>${groupScoreBadge}</td>
      <td style="color:var(--ink-3);font-size:13px;">${totalIssues > 0 ? totalIssues + ' issue' + (totalIssues !== 1 ? 's' : '') : '—'}</td>
      <td style="color:var(--ink-3);font-size:13px;white-space:nowrap;">${lastDate}</td>
      <td></td>
    </tr>`;

    if (isOpen) {
      for (const r of reports) {
        const sc = r.avg_score !== null && r.avg_score !== undefined ? r.avg_score : null;
        const scoreBadge = `<span class="score-badge ${scoreClass(sc)}">${sc !== null ? sc : '—'}</span>`;
        const pages = (r.pages_total != null) ? `${r.pages_scanned ?? '?'} / ${r.pages_total}` : '—';
        const escapedUrl = esc(r.url || '');
        const escapedToken = esc(r.token);
        const scanDate = fmtDate(r.completed_at || r.created_at);

        tbody += `<tr class="sub-row">
          <td></td>
          <td>
            <span class="type-badge type-scan">Scan</span>
            <span class="url-cell" title="${escapedUrl}">${escapedUrl}</span>
          </td>
          <td>${scoreBadge}</td>
          <td style="color:var(--ink-3);font-size:13px;">${pages}</td>
          <td>${statusChip(r.status)}</td>
          <td style="color:var(--ink-3);font-size:13px;white-space:nowrap;">${scanDate}</td>
          <td><a class="open-btn" href="/reports/${escapedToken}">Open →</a></td>
        </tr>`;

        for (const a of (r.manual_audits || [])) {
          const auditDate = fmtDate(r.created_at);
          const escapedAuditName = esc(a.name || '');
          const escapedAuditId = esc(a.id || '');
          const issueLabel = `${a.findings_count} issue${a.findings_count !== 1 ? 's' : ''}`;

          tbody += `<tr class="sub-row">
            <td></td>
            <td>
              <span class="type-badge type-manual">Manual</span>
              <span style="display:block;margin-top:2px;color:var(--ink-2);font-size:13px;">${escapedAuditName}</span>
            </td>
            <td><span class="score-none score-badge">—</span></td>
            <td style="color:var(--ink-3);font-size:13px;">${issueLabel}</td>
            <td></td>
            <td style="color:var(--ink-3);font-size:13px;white-space:nowrap;">${auditDate}</td>
            <td>
              <div class="row-actions">
                <a class="open-btn" href="/reports/${escapedToken}#manual-${escapedAuditId}">Open →</a>
                <div class="kebab-wrap">
                  <button class="kebab-btn"
                          data-token="${escapedToken}"
                          data-audit-id="${escapedAuditId}"
                          data-audit-name="${escapedAuditName}"
                          aria-label="Audit options"
                          aria-haspopup="true">⋮</button>
                </div>
              </div>
            </td>
          </tr>`;
        }
      }
    }
  }

  container.innerHTML = `<div class="section-card">
    <table class="reports-table">
      <thead>
        <tr>
          <th></th>
          <th>Domain / Type</th>
          <th colspan="5"></th>
          <th>Score</th>
          <th>Issues</th>
          <th>Last scan</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

async function loadReports() {
  const session = localStorage.getItem('e11y_session');
  const container = document.getElementById('reports-container');
  container.innerHTML = `<div class="section-card"><div class="empty-state"><p class="empty-state-title" style="color:var(--ink-3)">Loading…</p></div></div>`;

  try {
    const res = await fetch(`${API}/v1/my/reports`, {
      headers: { 'Authorization': `Bearer ${session}` },
    });

    if (res.status === 401) {
      localStorage.removeItem('e11y_session');
      window.location.replace('/app/login');
      return;
    }

    if (!res.ok) {
      container.innerHTML = `<div class="section-card"><div class="empty-state"><p class="empty-state-title">Failed to load reports</p><p class="empty-state-body">Please try refreshing.</p></div></div>`;
      return;
    }

    const data = await res.json();
    apiReports = data.reports || [];
    render();
  } catch (err) {
    container.innerHTML = `<div class="section-card"><div class="empty-state"><p class="empty-state-title">Something went wrong</p><p class="empty-state-body">Please try again.</p></div></div>`;
  }
}

document.getElementById('search').addEventListener('input', function() {
  query = this.value;
  render();
});

let openKebab = null;

function closeKebab() {
  if (openKebab) {
    openKebab.el.remove();
    openKebab = null;
  }
}

function openKebabMenu(btn) {
  closeKebab();
  const token = btn.dataset.token;
  const auditId = btn.dataset.auditId;
  const auditName = btn.dataset.auditName;

  const menu = document.createElement('div');
  menu.className = 'kebab-menu';
  menu.innerHTML = `
    <button data-action="rename">Rename</button>
    <button data-action="duplicate">Duplicate</button>
    <hr>
    <button data-action="delete" class="kebab-delete">Delete</button>`;

  menu.querySelectorAll('button').forEach(item => {
    item.addEventListener('click', e => {
      e.stopPropagation();
      const action = item.dataset.action;
      closeKebab();
      if (action === 'rename') startRename(token, auditId, auditName);
      if (action === 'duplicate') doAuditAction(token, auditId, 'duplicate');
      if (action === 'delete') doAuditAction(token, auditId, 'delete', auditName);
    });
  });

  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect();
  menu.style.position = 'fixed';
  menu.style.top = (r.bottom + 4) + 'px';
  menu.style.right = (window.innerWidth - r.right) + 'px';

  openKebab = { token, auditId, el: menu };
}

document.addEventListener('click', e => {
  if (!e.target.closest('.kebab-wrap')) closeKebab();
});

const APIBASE = 'https://platform-production-ace5.up.railway.app';

async function syncToAPI(token, audits) {
  const key = localStorage.getItem(`e11y_token_${token}`);
  if (!key) return;
  try {
    const existing = await fetch(`${APIBASE}/v1/public/report/view/${token}/annotations`)
      .then(r => r.ok ? r.json() : {}).catch(() => ({}));
    await fetch(`${APIBASE}/v1/public/report/view/${token}/annotations`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({ manual_audits: audits, issue_overrides: existing.issue_overrides || {} }),
    });
  } catch {}
}

function getLocalAudits(token) {
  try { return JSON.parse(localStorage.getItem(`e11y_audits_${token}`)) || []; } catch { return []; }
}

function saveLocalAudits(token, audits) {
  try { localStorage.setItem(`e11y_audits_${token}`, JSON.stringify(audits)); } catch {}
}

function updateRegistry(token, audits) {
  try {
    const reg = JSON.parse(localStorage.getItem('e11y_report_registry') || '[]');
    const idx = reg.findIndex(r => r.token === token);
    if (idx >= 0) {
      reg[idx].manual_audits = audits.map(a => ({
        id: a.id, name: a.name, findings_count: (a.findings || []).length,
      }));
      localStorage.setItem('e11y_report_registry', JSON.stringify(reg));
    }
  } catch {}
}

function doAuditAction(token, auditId, action, auditName) {
  const audits = getLocalAudits(token);
  let updated;

  if (action === 'delete') {
    const audit = audits.find(a => a.id === auditId);
    const count = (audit?.findings || []).length;
    const msg = count > 0
      ? `Delete "${auditName}"? It contains ${count} issue${count !== 1 ? 's' : ''} and cannot be recovered.`
      : `Delete "${auditName}"? This cannot be undone.`;
    if (!confirm(msg)) return;
    updated = audits.filter(a => a.id !== auditId);
  } else if (action === 'duplicate') {
    const src = audits.find(a => a.id === auditId);
    if (!src) return;
    updated = [...audits, {
      ...JSON.parse(JSON.stringify(src)),
      id: 'ma_' + Date.now() + Math.random().toString(36).slice(2),
      name: `Copy of ${src.name}`,
      closed: false,
    }];
  }

  saveLocalAudits(token, updated);
  updateRegistry(token, updated);
  syncToAPI(token, updated);
  render();
}

function startRename(token, auditId, currentName) {
  const backdrop = document.createElement('div');
  backdrop.className = 'rename-backdrop';
  backdrop.innerHTML = `
    <div class="rename-dialog" role="dialog" aria-modal="true" aria-labelledby="rd-title">
      <h2 id="rd-title">Rename audit</h2>
      <input id="rd-input" type="text" value="${esc(currentName)}" autocomplete="off" />
      <div class="rename-dialog-footer">
        <button class="btn-secondary" id="rd-cancel">Cancel</button>
        <button class="btn-primary-sm" id="rd-ok">Rename</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#rd-input');
  setTimeout(() => { input.focus(); input.select(); }, 20);

  function commit() {
    const newName = input.value.trim();
    if (!newName || newName === currentName) { backdrop.remove(); return; }
    backdrop.remove();
    const audits = getLocalAudits(token);
    const audit = audits.find(a => a.id === auditId);
    if (audit) audit.name = newName;
    saveLocalAudits(token, audits);
    updateRegistry(token, audits);
    syncToAPI(token, audits);
    render();
  }

  backdrop.querySelector('#rd-cancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#rd-ok').addEventListener('click', commit);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') backdrop.remove();
  });
}

document.getElementById('reports-container').addEventListener('click', function(e) {
  const kebabBtn = e.target.closest('.kebab-btn');
  if (kebabBtn) { e.stopPropagation(); openKebabMenu(kebabBtn); return; }

  const groupRow = e.target.closest('.group-row');
  if (groupRow) {
    const domain = groupRow.dataset.domain;
    expandedGroups[expandedGroups.has(domain) ? 'delete' : 'add'](domain);
    render();
  }
});

loadReports();
</script>
